<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" initial-content="1">
    <meta name="author" content="Lucas Daniel Gomes Echeverria">
    <meta name="description" content="fazer um formulario para exerciocio">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">

</head>

<body>
    <header>
        <h1>Formulario de pesquisa</h1>

    </header>
    <main>
        <form>
            <div class="item-formulario coluna2">
                <label for="nomecompleto">Nome Completo:</label>
                <input type="text" id="nome-completo" name="nome-completo" required>
            </div>

            <div class="item-formulario coluna2">
                <label for="emaildousuario">E-mail:</label>
                <input type="email" id="email-do-usuario" name="email-do-usuario" required>
            </div>


            <label for="quantidade">Selecione a Quantidade</label>
            <select name="quantidade" id="quantidade">
                <option value="1">Um</option>
                <option value="2">Dois</option>
                <option value="3">Três</option>
            </select>

            <label for="navegador">Qual é o seu navegador de internet favorito?</label>
            <select id="navegador" name="navegador">
                <option value="chrome">Chrome</option>
                <option value="firefox">Firefox</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="other">Other</option>
            </select>
            <label for="pet" Você tem um bichinho de estimação?></label>
            <input type="checkbox" id="pet" name="pet">
            <label for="feedback">Liste os lugares onde você morou:</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Stillwater Flórida, Amsterdã Holanda, Tibuktu Mali"></textarea>

            <button type="submit">Enviar Pesquisa</button>

        </form>

    </main>
    <footer>
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Odit dolorum dolore tenetur
            natus quisquam, accusantium sed culpa molestias? Natus, possimus.</p>


    </footer>
</body>


</html>
